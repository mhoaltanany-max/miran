name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install
        run: npm install

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: App icon
        run: |
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for n in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            for f in ic_launcher ic_launcher_round ic_launcher_foreground; do
              cp icons/mipmap-$n/ic_launcher.png $RES/mipmap-$n/$f.png
            done
          done

      - name: Same signing key every build (so updates install over the old app)
        run: |
          mkdir -p ~/.android
          cp android-debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../miran.apk

      - uses: actions/upload-artifact@v4
        with:
          name: miran-apk
          path: miran.apk

      - name: Publish release (download link for the phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: مران 1.0.${{ github.run_number }}
          body: نزّل ملف miran.apk على موبايل أندرويد وثبّته. التطبيق بيتحدّث لحاله من الإنترنت، ما في داعي تنزّله مرة ثانية.
          files: miran.apk
          make_latest: true
